<title>Enes FitApp</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f2; --surface:#fcfcfb; --surface2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6e68;
  --line:#e4e3de; --grid:#e9e8e4; --s1:#2a78d6; --btn:#2a78d6; --link:#1c5cab;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --surface2:#242423; --ink:#f4f4f1; --ink2:#c3c2b7; --muted:#9a998f;
    --line:#2d2d2b; --grid:#2a2a28; --s1:#3987e5; --link:#6da7ec; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --surface2:#242423; --ink:#f4f4f1; --ink2:#c3c2b7; --muted:#9a998f;
  --line:#2d2d2b; --grid:#2a2a28; --s1:#3987e5; --link:#6da7ec; --shadow:0 1px 2px rgba(0,0,0,.4);
}
/* ---- arayüz rengi (vurgu): mavi varsayılan, diğerleri beyaz-metin ve yüzey kontrastı hesaplanarak seçildi ---- */
[data-accent="orange"]{--s1:#eb6834; --btn:#ce4914; --link:#c94714;}
[data-accent="aqua"]{--s1:#1baf7a; --btn:#15875e; --link:#14835b;}
[data-accent="green"]{--s1:#008300; --btn:#008300; --link:#008300;}
[data-accent="violet"]{--s1:#4a3aa7; --btn:#4a3aa7; --link:#4a3aa7;}
[data-accent="red"]{--s1:#e34948; --btn:#df2f2d; --link:#de2a29;}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"]))[data-accent="orange"]{--s1:#d95926; --btn:#c35022; --link:#da5c2a;}
  :root:where(:not([data-theme="light"]))[data-accent="aqua"]{--s1:#199e70; --btn:#15845d; --link:#199e70;}
  :root:where(:not([data-theme="light"]))[data-accent="green"]{--s1:#008300; --btn:#008300; --link:#009700;}
  :root:where(:not([data-theme="light"]))[data-accent="violet"]{--s1:#9085e9; --btn:#7162e3; --link:#9085e9;}
  :root:where(:not([data-theme="light"]))[data-accent="red"]{--s1:#e66767; --btn:#dd3232; --link:#e66767;}
}
:root[data-theme="dark"][data-accent="orange"]{--s1:#d95926; --btn:#c35022; --link:#da5c2a;}
:root[data-theme="dark"][data-accent="aqua"]{--s1:#199e70; --btn:#15845d; --link:#199e70;}
:root[data-theme="dark"][data-accent="green"]{--s1:#008300; --btn:#008300; --link:#009700;}
:root[data-theme="dark"][data-accent="violet"]{--s1:#9085e9; --btn:#7162e3; --link:#9085e9;}
:root[data-theme="dark"][data-accent="red"]{--s1:#e66767; --btn:#dd3232; --link:#e66767;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
img,svg{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
/* iOS: 16px altındaki alanlara dokununca sayfa yakınlaşıp kayar */
input,select,textarea{font-size:16px}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:0 0 auto;display:block}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon svg,.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;min-height:58px}
.tabs button[aria-selected="true"]{color:var(--link)}

main{max-width:720px;margin:0 auto;padding:16px 16px 8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stack>*{min-width:0}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 2px -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--btn);color:#fff;font-weight:650;min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--line)}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;padding:6px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
@media(min-width:720px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2);min-height:36px}
.chip[aria-pressed="true"],.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip.done::after{content:" ✓"}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:13px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:650;color:var(--ink2);min-height:40px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* today */
.greet{font-size:22px;font-weight:750;letter-spacing:-.01em}
.phase{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.wk i{height:6px;border-radius:3px;background:var(--grid)}
.wk i.past{background:color-mix(in srgb,var(--s1) 45%,var(--grid))}
.wk i.now{background:var(--s1)}
.wk i.dl{background:var(--muted);opacity:.5}
.prog{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--s1);border-radius:3px;transition:width .25s}
.ex header{display:flex;gap:12px;align-items:flex-start}
.ex .no{flex:0 0 28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2);margin-top:1px}
.ex.done .no{background:var(--good);color:#fff}
.ex h3{font-size:16px;line-height:1.25}
.ex .t{flex:1;min-width:0}
.coach{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--ink2);font-size:14px}
.coach b{color:var(--ink)}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:22px 1fr 16px 1fr 34px;align-items:center;gap:8px}
.set .sn{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:17px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.set input:focus{outline:2px solid var(--s1);outline-offset:1px;border-color:transparent}
.set .ok{font-size:12px;color:var(--muted);text-align:center}
.set .ok.y{color:var(--good);font-size:20px;font-weight:800}
.set.filled input.rp{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.exf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.more summary,details.acc summary{cursor:pointer;color:var(--link);font-weight:600;font-size:14px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details.more p{color:var(--ink2);font-size:14px;margin:6px 0}
details.more select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;margin-top:6px}
.alts{color:var(--muted);font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ARTIR::before{background:var(--good)}
.pill.DEVAM::before{background:var(--s1)}
.pill.ZORLANDI::before{background:var(--warn)}
.pill.DUSUR::before{background:var(--serious)}
.pill.DELOAD::before{background:var(--muted)}
.pill.ARTIR::after{content:"▲"}.pill.DUSUR::after{content:"▼"}.pill.ZORLANDI::after{content:"!"}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.tl{font-size:12.5px;color:var(--muted);font-weight:600}
.tv{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tv small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.ts{font-size:12.5px;color:var(--muted);margin-top:1px}
.hero{font-size:48px;font-weight:780;letter-spacing:-.03em;line-height:1}
.hero small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
.delta{font-size:14px;font-weight:650;margin-top:6px}
.delta.up::before{content:"▲ ";color:var(--good)}
.delta.dn::before{content:"▼ ";color:var(--serious)}

/* charts */
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .ln{stroke:var(--s1);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--s1);opacity:.1}
.chart .dt{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.chart .lb{fill:var(--ink);font-size:12px;font-weight:700}
.chart .bar{fill:var(--s1)}
.chart .hasH .bar:not(.hov){opacity:.5}
.chart .cross{stroke:var(--muted);stroke-width:1;opacity:0}
.chart .tgt{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
.tip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.tip span{color:var(--muted)}
.tip i{display:inline-block;width:12px;height:2px;background:var(--s1);vertical-align:middle;margin-right:6px}
.empty{text-align:center;padding:26px 12px;color:var(--ink2)}
.empty h2{font-size:18px;margin-bottom:6px;color:var(--ink)}
.empty .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.nodata{padding:24px 8px;text-align:center;color:var(--muted);font-size:14px}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:12.5px;padding:6px 6px 6px 0}
td{padding:9px 6px 9px 0;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
.list{display:grid;gap:0}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{display:block}
.li small{color:var(--muted);font-size:13px}
.badge{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px;box-shadow:var(--shadow)}
details.acc summary{padding:12px 0;color:var(--ink);font-size:15px;font-weight:700;display:flex;justify-content:space-between}
details.acc summary{gap:10px;align-items:baseline}
details.acc summary>span:first-child{flex:1;min-width:0}
details.acc summary>span.sub{white-space:nowrap}
details.acc summary::after{content:"＋";color:var(--muted)}
details.acc[open] summary::after{content:"－"}
details.acc .body{padding:0 0 12px}

/* plan */
.roadmap{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.roadmap button{border:1px solid var(--line);border-radius:9px;padding:9px 0;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink2)}
.roadmap button.p1{background:color-mix(in srgb,var(--s1) 12%,var(--surface))}
.roadmap button.p2{background:color-mix(in srgb,var(--s1) 26%,var(--surface))}
.roadmap button.dl{background:var(--surface2);color:var(--muted)}
.roadmap button.now{outline:2px solid var(--s1);outline-offset:1px;color:var(--ink)}
.roadmap button[aria-pressed="true"]{border-color:var(--ink)}
.day .head{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;background:none;border:0;text-align:left;padding:0}
.day .dn{flex:0 0 46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-weight:750;font-size:14px}
.day .head h3{font-size:16px}
.day .exl{margin-top:10px;display:none}
.day.open .exl{display:block}
.day .head::after{content:"";flex:0 0 auto;width:8px;height:8px;margin:0 6px 4px 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.day.open .head::after{transform:rotate(-135deg);margin-bottom:-4px}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.fld textarea{height:64px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--s1);outline-offset:1px;border-color:transparent}
.fld.full{grid-column:1/-1}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper .c{display:flex;align-items:center;gap:6px}
.stepper .c button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.stepper .c output{min-width:44px;text-align:center;font-weight:750;font-size:18px;font-variant-numeric:tabular-nums}

/* timer, banner, dialog */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:700}
#timer[hidden]{display:none}
#timer .tm{font-size:20px;font-variant-numeric:tabular-nums}
#timer small{opacity:.7;font-weight:500;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer button{border:0;border-radius:999px;background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg);padding:8px 14px;font-weight:700}
.banner{max-width:720px;margin:12px auto 0;padding:0 16px}
.banner .b{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));font-size:13.5px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.banner .b.info{background:color-mix(in srgb,var(--s1) 12%,var(--surface));border-color:color-mix(in srgb,var(--s1) 35%,var(--line))}
/* kendi modal penceremiz (eski iPhone / uygulama içi tarayıcılarda <dialog> yok) */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;max-width:520px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.35)}
body.lock{overflow:hidden}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h2{font-size:20px}
.dlg .letter{white-space:pre-line;color:var(--ink2);font-size:15px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.swrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent;background:var(--sw);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- ek: mobil, tur, video, yedekler ---- */
.top{padding-top:env(safe-area-inset-top,0px)}
select.chip{font-size:16px;padding:6px 12px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.vid{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--link);text-decoration:none;font-size:14px;margin-right:2px}
#boot{margin:16px 0}
#tour{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:55;padding:0 12px;display:flex;justify-content:center;pointer-events:none}
#tour[hidden]{display:none}
.tcard{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:grid;gap:10px}
.tcard .tt{font-size:16px}
.tcard ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;display:grid;gap:5px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--grid)}
.dots i.on{background:var(--s1)}
.hl{position:relative;z-index:56;border-radius:14px;outline:3px solid var(--s1);outline-offset:-5px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{outline-color:var(--s1)}50%{outline-color:rgba(42,120,214,.35)}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}
@supports not (background:color-mix(in srgb,red 50%,blue)){
  .top{background:var(--bg)}
  .wk i.past{background:rgba(42,120,214,.5)}
  .set.filled input.rp{background:rgba(12,163,12,.12)}
  .roadmap button.p1{background:rgba(42,120,214,.14)}
  .roadmap button.p2{background:rgba(42,120,214,.28)}
  #timer button{background:rgba(255,255,255,.2)}
  .banner .b{background:rgba(250,178,25,.18);border-color:rgba(250,178,25,.45)}
  .banner .b.info{background:rgba(42,120,214,.12);border-color:rgba(42,120,214,.35)}
}
.brand{flex:1 1 auto;min-width:0}
.brand>div{min-width:0}
.brand b,.brand small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.greet,.li small,.li b,.sub,.badge,.coach,.hint{overflow-wrap:anywhere}
.ex h3 .badge{white-space:normal;display:inline-block;max-width:100%;vertical-align:middle}
</style>
</head>

function statusOf(ex,c,dl,prev){

  const atMax=c.filter(s=>s.reps>=ex.max).length;
  if(c.length>=ex.sets&&atMax>=ex.sets)return 'ARTIR';

function allSeries(){
  const by={};
  Object.values(S.logs).forEach(l=>{
    const c=cs(l);if(!c.length)return;
    const key=l.mid+'|'+(l.v||'');
    const b=by[key]||(by[key]={key,mid:l.mid,v:l.v||'',days:{}});
    const e=Math.max(...c.map(e1rm)),top=Math.max(...c.map(s=>s.kg)),reps=Math.max(...c.map(s=>s.reps));
    const vol=c.reduce((a,s)=>a+s.kg*s.reps,0);
    const d=b.days[l.d]||(b.days[l.d]={d:l.d,e:0,top:0,reps:0,vol:0,c:[],dl:phaseOf(weekOf(l.d)).dl});
    d.e=Math.max(d.e,e);d.top=Math.max(d.top,top);d.reps=Math.max(d.reps,reps);d.vol+=vol;d.c=d.c.concat(c);
  });
  const out=Object.values(by).map(b=>{
    // deload seansları bilerek hafiftir: güç trendini bozmasın diye çizgiden çıkar (hepsi deload ise olduğu gibi bırak)
    const all=Object.values(b.days).sort((a,c)=>a.d<c.d?-1:1),work=all.filter(s=>!s.dl);
    const sess=work.length?work:all;
    const bw=sess.every(s=>s.top===0);
    const mode=bw?'bw':(MOVE[b.mid].hi>12?'kg':'e1rm');
    sess.forEach(s=>s.y=mode==='bw'?s.reps:mode==='kg'?s.top:s.e);
    return{key:b.key,mid:b.mid,v:b.v,bw,mode,sess,name:MOVE[b.mid].ad+(b.v?' · '+b.v:'')};
  });
  out.sort((a,b)=>MID_ORDER.indexOf(a.mid)-MID_ORDER.indexOf(b.mid)||(a.v<b.v?-1:1));
  return out;
}
function prsOf(series){

  series.forEach(s=>{let best=s.sess[0].y;for(let i=1;i<s.sess.length;i++){const x=s.sess[i];if(x.y>best+0.001){out.push({name:s.name,d:x.d,from:best,to:x.y,bw:s.bw});best=x.y}}});
  return out.sort((a,b)=>a.d<b.d?1:-1);

function weekly(){

function niceTicks(lo,hi,n){

  const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;

  const near=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width);let b=0,bd=1e9;P.forEach((q,i)=>{const d=Math.abs(q[0]-px);if(d<bd){bd=d;b=i}});return b};
  svg.addEventListener('pointermove',e=>show(near(e)));
  svg.addEventListener('pointerdown',e=>show(near(e)));
  svg.addEventListener('pointerleave',hide);
  svg.addEventListener('blur',hide);
  svg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(clamp((cur<0?P.length-1:cur)+(e.key==='ArrowLeft'?-1:1),0,P.length-1))}});
}
function barChart(host,items,o){
  o=o||{};
  const W=Math.max(260,host.clientWidth||320),H=o.h||170,m={l:42,r:10,t:20,b:24};
  const mx=Math.max(1,...items.map(i=>i.v),o.target||0),ticks=niceTicks(0,mx,3),yM=ticks[ticks.length-1];
  const Y=v=>H-m.b-(v/yM)*(H-m.t-m.b);
  let g='';
  ticks.forEach(v=>{g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${o.tickFmt?o.tickFmt(v):fnum(v,0)}</text>`});
  if(o.target)g+=`<line class="tgt" x1="${m.l}" x2="${W-m.r}" y1="${Y(o.target)}" y2="${Y(o.target)}"/>`;
  const band=(W-m.l-m.r)/items.length,bw=Math.min(24,band*0.62);
  let bars='',hits='',lastNZ=-1;items.forEach((it,i)=>{if(it.v>0)lastNZ=i});
  items.forEach((it,i)=>{
    const x=m.l+band*i+(band-bw)/2,y=Y(it.v),h=H-m.b-y;
    if(it.v>0){const r=Math.min(4,h/2);
      bars+=`<path class="bar" data-i="${i}" d="M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${y+h}Z"/>`;}
    if(i===lastNZ)bars+=`<text class="lb" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${o.valFmt?o.valFmt(it.v):fnum(it.v,0)}</text>`;
    g+=`<text class="ax" x="${m.l+band*i+band/2}" y="${H-6}" text-anchor="middle" ${it.cur?'style="font-weight:700;fill:var(--ink)"':''}>${esc(it.label)}</text>`;
    hits+=`<rect data-i="${i}" x="${m.l+band*i}" y="0" width="${band}" height="${H}" fill="transparent"/>`;
  });
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Grafik')}">${g}<g class="bg">${bars}</g>${hits}</svg><div class="tip"></div>`;
  const svg=$('svg',host),tip=$('.tip',host),grp=$('.bg',svg);
  const on=i=>{
    grp.classList.add('hasH');$$('.bar',svg).forEach(b=>b.classList.toggle('hov',+b.dataset.i===i));
    const it=items[i];setTip(tip,it.title,it.rows);tip.style.display='block';
    tip.style.left=clamp(m.l+band*i+band/2,70,W-70)+'px';tip.style.top=Math.max(20,Y(it.v)-8)+'px';
  };
  const off=()=>{grp.classList.remove('hasH');$$('.bar',svg).forEach(b=>b.classList.remove('hov'));tip.style.display='none'};
  $$('rect',svg).forEach(r=>{r.addEventListener('pointermove',()=>on(+r.dataset.i));r.addEventListener('pointerdown',()=>on(+r.dataset.i))});
  svg.addEventListener('pointerleave',off);
}

function setRow(ex,i,vals,sug,bw){

}
function cardHTML(ex,date){
  const w=weekOf(date),key=logKey(date,ex.slot),log=S.logs[key],v=(log&&log.v)||'';
  const n=setsFor(ex,w),sg=suggest(ex,v,date);
  const stored=(log&&log.sets)||[];
  // rows without reps inherit kg from the last row that has reps, else suggestion
  let carry=null;const vals=[];
  for(let i=0;i<n;i++){const s=stored[i];if(s&&s.reps>0){vals.push(s);carry=s.kg}else vals.push({kg:carry!=null?carry:(s&&s.kg!=null?s.kg:null),reps:null})}
  const rows=vals.map((_,i)=>setRow(ex,i,vals,sg.kg,ex.bw)).join('');
  const opts=['<option value="">'+esc(ex.ad)+' (ana hareket)</option>'].concat(ex.alts.map(a=>`<option value="${esc(a)}"${a===v?' selected':''}>${esc(a)}</option>`)).join('');
  return `<article class="card ex" data-slot="${ex.slot}" data-n="${n}">
   <header><span class="no">${ex.day.ex.indexOf(ex)+1}</span><div class="t"><h3>${esc(ex.ad)}${v?' <span class="badge">'+esc(v)+'</span>':''}</h3>
   <div class="sub">${n} × ${ex.slot==='sal-pu'?'Max':ex.min+'-'+ex.max} · ${esc(ex.not)} · ⏱ ${esc(ex.rest)}</div></div>
   <a class="vid" href="${ytUrl(ex,v)}" target="_blank" rel="noopener" aria-label="Nasıl yapılır videosu">▶</a><span class="pill" data-role="pill" hidden></span></header>

   <div class="exf"><button class="linkbtn" data-act="fill">Geçen seferi doldur</button><span class="sub" data-role="cnt"></span></div>
   <details class="more"><summary>İpucu, alternatifler ve versiyon</summary>
    <p>💡 ${esc(ex.tip)}</p>
    <p><a class="linkbtn" href="${ytUrl(ex,v)}" target="_blank" rel="noopener">▶ Nasıl yapılır? Videoyu aç</a></p>
    <p class="alts">↺ Zorlanırsan / alet doluysa: ${ex.alts.map(esc).join(' · ')}</p>
    <select data-role="ver" aria-label="Versiyon">${opts}</select>
    <p class="hint">Versiyonu değiştirirsen bu hareket ayrı takip edilir; grafikler karışmaz.</p></details></article>`;
}
function refreshCard(art){
  const ex=SLOT[art.dataset.slot],date=ui.date,w=weekOf(date),n=+art.dataset.n;
  const log=S.logs[logKey(date,ex.slot)],v=(log&&log.v)||'';
  const c=log?cs(log):[];
  const sg=suggest(ex,v,date);
  const st=statusOf(ex,c,phaseOf(w).dl,sg.p.prev);
  const done=c.length>=n;
  art.classList.toggle('done',done);
  const pill=$('[data-role=pill]',art);
  if(st&&(done||c.length)){pill.hidden=false;pill.className='pill '+st;pill.textContent=STLAB[st]}else pill.hidden=true;
  let html=hintText(ex,v,date,sg);
  if(done&&st){html+='<br><b>Bugün:</b> '+resultText(ex,st,Math.max(...c.map(s=>s.kg)))}
  $('[data-role=coach]',art).innerHTML=html;
  $('[data-role=cnt]',art).textContent=c.length+'/'+n+' set';
  $$('.set',art).forEach(r=>{
    const rp=num($('.rp',r).value),kg=num($('.kg',r).value),ok=$('.ok',r);
    const bad=(rp!=null&&(rp<=0||rp>100))||(kg!=null&&(kg<0||kg>1000));
    const good=rp>0&&kg!=null&&!bad;
    r.classList.toggle('filled',good);
    ok.className='ok'+(good?' y':'');ok.textContent=good?'✓':(bad?'!':(rp>0?'kg?':''));
  });
  updateProgress();
}
function updateProgress(){
  const arts=$$('.ex');if(!arts.length)return;
  let d=0;arts.forEach(a=>{if(a.classList.contains('done'))d++});
  const p=$('#dayprog');if(p){$('i',p).style.width=(d/arts.length*100)+'%';$('#daycnt').textContent=d+'/'+arts.length+' hareket'}
  const f=$('#finish');
  if(f){
    if(d===arts.length){
      let vol=0;arts.forEach(a=>{const l=S.logs[logKey(ui.date,a.dataset.slot)];if(l)cs(l).forEach(s=>vol+=s.kg*s.reps)});
      f.hidden=false;f.innerHTML='<h2>Antrenman tamam 💪</h2><p class="sub">Toplam hacim: <b>'+fint(vol)+' kg</b>. Gelişim sekmesinde grafiğine bak.</p>';
    }else f.hidden=true;
  }
}
function saveCard(art,startTimer){
  const ex=SLOT[art.dataset.slot],key=logKey(ui.date,ex.slot),old=S.logs[key];
  const sets=$$('.set',art).map(r=>{const rp=num($('.rp',r).value),kg=num($('.kg',r).value);return rp>0&&rp<=100&&(kg==null||(kg>=0&&kg<=1000))?{kg,reps:Math.round(rp)}:{kg:null,reps:null}});
  const v=(old&&old.v)||'';
  if(!sets.some(s=>s.reps>0)&&!v){delete S.logs[key]}
  else S.logs[key]={d:ui.date,slot:ex.slot,mid:ex.mid,v,sets};
  save();refreshCard(art);
}

const BM=[['kilo','Kilo','kg'],['bel','Bel','cm'],['gogus','Göğüs','cm'],['omuz','Omuz','cm'],['boyun','Boyun','cm'],['sagkol','Sağ kol','cm'],['solkol','Sol kol','cm'],['sagbacak','Sağ bacak','cm'],['solbacak','Sol bacak','cm'],['yag','Tahmini yağ','%']];
function derive(e){
  const h=+S.profile.boy,o={};
  if(e.kilo)o.bmi=e.kilo/Math.pow(h/100,2);
  if(e.bel)o.belboy=e.bel/h;
  if(e.bel&&e.boyun&&e.bel>e.boyun)o.yag=495/(1.0324-0.19077*Math.log10(e.bel-e.boyun)+0.15456*Math.log10(h))-450;
  if(e.sagkol&&e.solkol)o.kolfark=e.sagkol-e.solkol;
  return o;
}
function bodySeries(){
  const arr=S.body.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(S.profile.kilo&&!arr.some(e=>e.d===S.profile.start&&e.kilo))arr.unshift({d:S.profile.start,kilo:+S.profile.kilo,_base:1});
  return arr;
}
const latest=(arr,k)=>{for(let i=arr.length-1;i>=0;i--){const v=k==='yag'?derive(arr[i]).yag:arr[i][k];if(v!=null&&!isNaN(v))return v}return null};

/* ---- kilo trendi (son 28 gün, en küçük kareler) ---- */
function weightTrend(){
  const now=nowISO(),from=addDays(now,-28);
  const pts=bodySeries().filter(e=>e.kilo&&e.d>=from&&e.d<=now).map(e=>[dnum(e.d),e.kilo]);
  if(pts.length<2)return null;
  const span=pts[pts.length-1][0]-pts[0][0];if(span<7)return null;
  const n=pts.length,mx=pts.reduce((a,q)=>a+q[0],0)/n,my=pts.reduce((a,q)=>a+q[1],0)/n;
  let sxy=0,sxx=0;pts.forEach(q=>{sxy+=(q[0]-mx)*(q[1]-my);sxx+=(q[0]-mx)*(q[0]-mx)});
  const perWeek=sxy/sxx*7,last=pts[pts.length-1][1];
  return{perWeek,pct:perWeek/last*100,n,span};
}
// Hedef aralıkları (gövde ağırlığının yüzdesi/hafta): yağ yakımı -0,5…-1, recomp -0,5…+0,25, kas kazanımı +0,25…+0,5
function trendMsg(t,goal){
  if(!t)return null;
  const p=t.pct,ok=(a,b)=>p>=a&&p<=b;
  if(goal==='yag'){
    if(ok(-1,-0.5))return{level:'good',short:'hedef aralığında',txt:'Yağ yakımı için ideal hız (haftada %0,5-1). Böyle devam.'};
    if(p>-0.25)return{level:'warn',short:'yavaş / duruyor',txt:'Kilo yeterince düşmüyor. 2 hafta daha aynı planı sürdür; hâlâ düşmüyorsa günlük kaloriyi ~%5 azalt ya da adım/kardiyoyu artır.'};
    if(p<-1)return{level:'warn',short:'çok hızlı',txt:'Düşüş çok hızlı (haftada %1 üstü): kas kaybı riski. Kaloriyi ~%5-10 artır, proteini koru.'};
    return{level:'ok',short:'makul',txt:'Yavaş ama yönü doğru. Haftada %0,5-1 aralığı idealdir.'};
  }
  if(goal==='kas'){
    if(ok(0.25,0.5))return{level:'good',short:'hedef aralığında',txt:'Yağ oranını kontrolde tutan ideal kazanım hızı (haftada %0,25-0,5).'};
    if(p<0.1)return{level:'warn',short:'yetersiz artış',txt:'Kilo neredeyse artmıyor. Kaloriyi günde 150-200 kcal artır.'};
    if(p>0.75)return{level:'warn',short:'çok hızlı',txt:'Artış çok hızlı; kazanımın önemli kısmı yağ olabilir. Kaloriyi ~%5 azalt.'};
    return{level:'ok',short:'makul',txt:'Artış var; hızı %0,25-0,5 bandında tutmak idealdir.'};
  }
  if(ok(-0.5,0.25))return{level:'good',short:'hedef aralığında',txt:'Recomp için kilo stabil ya da hafif azalıyor. Bel ölçüsüne ve güç grafiğine birlikte bak.'};
  if(p<-0.5)return{level:'warn',short:'fazla hızlı düşüyor',txt:'Recomp için düşüş fazla hızlı. Kaloriyi ~%5-10 artır; güç düşüyorsa proteini kontrol et.'};
  return{level:'warn',short:'kilo artıyor',txt:'Kilo haftada %0,25 üstünde artıyor. Hedef recomp ise kaloriyi ~%5 azalt.'};
}
function trendCard(){
  const t=weightTrend(),m=trendMsg(t,S.profile.hedef);if(!m)return '';
  return `<div class="card"><h2>Kilo trendi</h2><p style="margin-top:6px"><b>${t.pct>0?'+':''}${fnum(t.pct,2)}% / hafta</b> <span class="sub">(${t.perWeek>0?'+':''}${fnum(t.perWeek,2)} kg/hafta · son ${t.n} tartı)</span></p><p style="margin-top:4px;font-size:14px;color:var(--ink2)">${m.txt}</p></div>`;

const GOALS={recomp:['Recomp (yağ ver + kas al)',0.9],yag:['Yağ yakımı',0.8],kas:['Kas kazanımı',1.1]};
function nutri(){
  const p=S.profile,arr=bodySeries(),w=latest(arr,'kilo')||+p.kilo;
  const bmr=Math.round(10*w+6.25*p.boy-5*p.yas+5),tdee=Math.round(bmr*p.akt),kcal=Math.round(tdee*GOALS[p.hedef][1]/10)*10;

function monday(s){return addDays(s,-wdOf(s))}
function loadDemo(){
  if(S.demo)return;
  const backup=JSON.parse(JSON.stringify(Object.assign({},S,{backup:null})));
  const today=todayISO(),start=addDays(monday(today),-42);
  S.backup=backup;S.demo=true;S.seen=true;S.intro=INTRO_V;S.logs={};S.body=[];S.uyum={};
  S.profile=Object.assign({},S.profile,{start,kilo:87});
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const last=clamp(weekOf(today),1,12);
  for(let w=1;w<=last;w++){
    DAYS.forEach((day,di)=>{
      const d=addDays(start,7*(w-1)+di);
      if(d>=today)return;
      if(day.id==='cmt'&&w%2)return;
      if(rnd()<0.07)return;
      day.ex.forEach(ex=>{
        const sg=suggest(ex,'',d),dl=phaseOf(w).dl;
        let kg=sg.kg!=null?sg.kg:roundTo(ex.base*(w<=2?0.85:1),ex.step);
        if(ex.bw)kg=0;
        const n=setsFor(ex,w),pat=(w+ex.slot.length+di)%3,sets=[];
        for(let i=0;i<n;i++){
          let r=pat===0?ex.max:pat===1?ex.min+1-(i>1?1:0):ex.min+2-(i>2?1:0);
          if(rnd()<.2)r-=1;
          if(dl)r=ex.max;
          if(ex.bw)r=clamp(ex.min+w-1,ex.min,ex.max);
          sets.push({kg,reps:clamp(r,Math.max(1,ex.min-1),ex.max)});
        }
        S.logs[logKey(d,ex.slot)]={d,slot:ex.slot,mid:ex.mid,v:'',sets};
      });
    });
    const bd=addDays(start,7*(w-1));
    if(bd<=today)S.body.push({d:bd,kilo:+(87-0.55*(w-1)+(rnd()-.5)*.4).toFixed(1),bel:+(96-.7*(w-1)).toFixed(1),gogus:+(104+.15*(w-1)).toFixed(1),omuz:+(118+.2*(w-1)).toFixed(1),boyun:39,sagkol:+(34+.2*(w-1)).toFixed(1),solkol:+(33.4+.2*(w-1)).toFixed(1),sagbacak:+(58+.15*(w-1)).toFixed(1),solbacak:+(57.7+.15*(w-1)).toFixed(1)});
    if(w<last)S.uyum[w]={p:3+Math.floor(rnd()*4),s:3+Math.floor(rnd()*4),u:2+Math.floor(rnd()*5),k:4+Math.floor(rnd()*4)};
  }
  save();renderBanner();closeDlg();ui.chart=null;setTab('gelisim');
}

function insights(){
  const now=nowISO(),from7=addDays(now,-6),logs=Object.values(S.logs).filter(l=>cs(l).length);
  const days7=new Set(logs.filter(l=>l.d>=from7&&l.d<=now).map(l=>l.d)).size;
  const prs=prsOf(allSeries()).filter(p=>p.d>=addDays(now,-13));

  });
  const wt=weightTrend(),tm=trendMsg(wt,S.profile.hedef),uw=clamp(weekOf(now),1,12),u=uyumScore(uw);
  return{days7,prs,struggle,wt,tm,uyum:u,week:weekOf(now)};

   <div class="acts" style="justify-content:flex-start"><button class="btn" id="sendbtn" data-act="sendmail">Mail olarak gönder</button></div>
   <details class="more"><summary>Başka yollarla gönder</summary><div class="acts" style="justify-content:flex-start;margin-top:8px"><a class="btn ghost" href="${esc(mailtoHref())}">Mail uygulamasını aç</a><button class="btn ghost" data-act="sharefile">Dosyayı paylaş</button><button class="btn ghost" data-act="wa">WhatsApp özeti</button><button class="btn line" data-act="copysum">Özeti kopyala</button></div></details>
   <div class="acts"><button class="btn ghost" data-act="closedlg">Kapat</button></div>`);
}
async function sendMail(){
  const btn=$('#sendbtn'),st=$('#sendst');btn.disabled=true;st.textContent='Gönderiliyor…';
  try{
    const fd=new FormData();
    fd.append('_subject','Enes FitApp raporu · '+(S.profile.ad||'')+' · '+fdate(todayISO()));
    fd.append('_captcha','false');
    fd.append('name',S.profile.ad||'Ozan');
    fd.append('message',summaryText());
    fd.append('rapor',new Blob([reportPayload()],{type:'application/json'}),'enes-fitapp-rapor-'+todayISO()+'.json');
    const r=await fetch('https://formsubmit.co/ajax/'+COACH_EMAIL,{method:'POST',body:fd,headers:{Accept:'application/json'}});
    let j={};try{j=await r.json()}catch(e){}
    if(r.ok&&String(j.success)==='true'){
      st.textContent='Gönderildi ✓ Rapor '+COACH_EMAIL+' adresine iletildi.';
      S.lastSent=new Date().toISOString();markBackup();btn.textContent='Tekrar gönder';btn.disabled=false;return;
    }
    throw new Error(j.message||('HTTP '+r.status));
  }catch(e){
    st.textContent='Otomatik gönderilemedi ('+String(e&&e.message||e).slice(0,140)+'). "Başka yollarla gönder" bölümünden mail uygulamasını aç ya da dosyayı paylaş.';
    const d=$('details.more',dlgin);if(d)d.open=true;btn.disabled=false;
  }
}
function reportPayload(){return JSON.stringify({kind:'ozanfit-rapor',app:1,sent:new Date().toISOString(),day:todayISO(),data:Object.assign({},S,{backup:null,demo:false})})}
async function shareFile(){
  const name='enes-fitapp-rapor-'+todayISO()+'.json',file=new File([reportPayload()],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Enes FitApp raporu',text:summaryText()});markBackup();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  markBackup();
  alert('Rapor dosyası indirildi. Şimdi WhatsApp\'ta antrenörüne bu dosyayı gönder.');
}
function lastReport(){try{return localStorage.getItem('ozanfit.coach')}catch(e){return null}}
function enterCoach(o){
  const data=o.data||o;
  if(!data||typeof data.logs!=='object'||!data.profile)throw new Error('bad');
  const day=o.day||(o.sent?iso(new Date(o.sent)):todayISO());
  if(!RO)SAVED=S;
  S=normalize(data);RO=true;REPORT={day,sent:o.sent||null};
  ui.tab='bugun';ui.chart=null;ui.uyumW=null;ui.roadW=null;ui.vsec='olcu';ui.metric='kilo';
  closeDlg();tourHide();renderBanner();render();window.scrollTo(0,0);
}
function exitCoach(){
  if(!RO)return;
  S=SAVED;SAVED=null;RO=false;REPORT=null;ui.tab='bugun';ui.chart=null;ui.uyumW=null;ui.roadW=null;
  closeDlg();applyTheme();applyAccent();renderBanner();render();
}
function openReport(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);enterCoach(o.kind==='ozanfit-rapor'?o:{data:o});try{localStorage.setItem('ozanfit.coach',fr.result)}catch(e){}}catch(e){alert('Bu dosya geçerli bir Enes FitApp raporu değil.')}};
  fr.readAsText(file);
}
function viewKayit(){
  const logs=Object.values(S.logs).filter(l=>cs(l).length);
  if(!logs.length)return `<div class="stack"><div class="card empty"><h2>Bu raporda henüz kayıt yok</h2><p>${esc(S.profile.ad||'Kullanıcı')} ilk antrenmanını kaydedince burada görünür.</p></div></div>`;
  const I=insights(),byDate={};
  logs.forEach(l=>(byDate[l.d]||(byDate[l.d]=[])).push(l));
  const dates=Object.keys(byDate).sort().reverse();
  const lvl=a=>a>=4?'İyi':a>=2?'Orta':'Az';
  const li=(t,sm,badge)=>`<div class="li"><div><b>${t}</b><small>${sm}</small></div>${badge?'<span class="badge">'+badge+'</span>':''}</div>`;
  const rows=[
    li('Son 7 gün',I.days7+' antrenman günü',lvl(I.days7)),
    li('Zorlanan hareketler',I.struggle.length?I.struggle.map(x=>esc(x.name)+' ('+fnum(Math.max(...x.c.map(q=>q.kg)))+' kg · '+repsText(x.c)+', '+STLAB[x.st]+')').join('<br>'):'Şu an zorlanan hareket yok',I.struggle.length?I.struggle.length:'✓'),
    li('Yeni rekorlar (14 gün)',I.prs.length?I.prs.slice(0,5).map(p=>esc(p.name)+' '+fnum(p.from)+' → '+fnum(p.to)+(p.bw?' tekrar':' kg')).join('<br>'):'Henüz yeni rekor yok',I.prs.length||'–'),
    li('Kilo trendi',I.tm?(I.wt.pct>0?'+':'')+fnum(I.wt.pct,2)+'% / hafta · '+esc(I.tm.txt):'Trend için en az 1 hafta arayla 2 tartı gerekli',I.tm?esc(I.tm.short):'–'),
    li('Uyum skoru (hafta '+clamp(I.week,1,12)+')','Protein, su, uyku, kreatin ve antrenman günü',I.uyum!=null?'%'+I.uyum:'–')
  ].join('');
  const order=Object.keys(SLOT);
  const sessions=dates.map((d,i)=>{
    const ls=byDate[d].slice().sort((a,b)=>order.indexOf(a.slot)-order.indexOf(b.slot));
    const vol=ls.reduce((a,l)=>a+cs(l).reduce((x,s)=>x+s.kg*s.reps,0),0);
    const day=DAYS.find(x=>ls[0].slot.startsWith(x.id+'-'));
    const items=ls.map(l=>{const ex=SLOT[l.slot],st=logStatus(l),c=cs(l);
      return `<div class="li"><div><b>${esc(ex.ad)}${l.v?' <span class="badge">'+esc(l.v)+'</span>':''}</b><small>${esc(setsText(c))}</small></div>${st?'<span class="pill '+st+'">'+STLAB[st]+'</span>':''}</div>`}).join('');
    return `<details class="acc"${i<2?' open':''}><summary><span>${fdate(d)} · ${DAYNAMES[wdOf(d)]}${day?' · '+esc(day.t):''}</span><span class="sub">H${weekOf(d)} · ${fint(vol)} kg</span></summary><div class="body"><div class="list">${items}</div></div></details>`;
  }).join('');
  return `<div class="stack">
   <div class="card"><h2>${esc(S.profile.ad||'Kullanıcı')} · rapor özeti</h2><p class="sub">${dates.length} antrenman günü kayıtlı · son kayıt ${fdate(dates[0])}${REPORT&&REPORT.sent?' · rapor '+fdate(REPORT.day):''}</p></div>
   <div class="card"><h2>Öne çıkanlar</h2><div class="list" style="margin-top:6px">${rows}</div></div>
   <div class="sec-t">Seans günlüğü</div>${sessions}</div>`;
}
{const _vb=V.bugun;V.bugun=()=>RO?viewKayit():_vb()}

/* ============================== EVENTS ============================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){setTab(t.dataset.tab);return}
  const a=t.dataset.act;
  if(RO&&MUT.has(a))return;
  switch(a){
    case 'tab':setTab(t.dataset.tab);break;
    case 'day':ui.day=t.dataset.day;render(true);break;
    case 'fill':{
      const art=t.closest('.ex'),ex=SLOT[art.dataset.slot],v=(S.logs[logKey(ui.date,ex.slot)]||{}).v||'';
      const p=progress(ex,v,ui.date);if(!p.last)return;
      const c=p.last.c;
      $$('.set',art).forEach((r,i)=>{const s=c[Math.min(i,c.length-1)];if(!s)return;if(!$('.rp',r).value){$('.kg',r).value=fnum(s.kg,2);$('.rp',r).value=s.reps}});
      saveCard(art);break;
    }
    case 'chart':ui.chart=t.dataset.key;render(true);break;
    case 'metric':ui.metric=t.dataset.m;render(true);break;
    case 'vsec':ui.vsec=t.dataset.s;render();break;
    case 'road':ui.roadW=+t.dataset.w;render(true);break;
    case 'opday':ui.openDay=ui.openDay===t.dataset.day?null:t.dataset.day;render(true);break;
    case 'start':ui.day=t.dataset.day;ui.date=todayISO();setTab('bugun');break;
    case 'uw':{const w=clamp((ui.uyumW||clamp(weekOf(nowISO()),1,12))+ +t.dataset.d,1,12);ui.uyumW=w;render(true);break}
    case 'uy':{const w=ui.uyumW||clamp(weekOf(nowISO()),1,12),k=t.dataset.k,u=S.uyum[w]||(S.uyum[w]={});u[k]=clamp((u[k]||0)+ +t.dataset.d,0,7);save();render(true);break}
    case 'savebody':{
      const g=id=>num($('#b_'+id).value),d=$('#b_d').value||todayISO();
      const e={d};let any=false;['kilo','bel','gogus','omuz','boyun','sagkol','solkol','sagbacak','solbacak'].forEach(k=>{const v=g(k);if(v!=null&&v>0&&v<=(k==='kilo'?400:250)){e[k]=v;any=true}});
      const nt=$('#b_not').value.trim();if(nt)e.not=nt;
      if(!any){alert('En az bir ölçü gir.');return}
      S.body=S.body.filter(x=>x.d!==d);S.body.push(e);save();render(true);break;
    }
    case 'delbody':if(confirm(fdate(t.dataset.d)+' ölçümü silinsin mi?')){S.body=S.body.filter(x=>x.d!==t.dataset.d);save();render(true)}break;
    case 'demo':if(S.demo)return;loadDemo();break;
    case 'rmdemo':if(confirm('Örnek veri kaldırılsın ve kendi kayıtların geri gelsin mi?'))removeDemo();break;
    case 'share':closeDlg();shareDlg();break;
    case 'sharefile':shareFile();break;
    case 'wa':window.open('https://wa.me/?text='+encodeURIComponent(summaryText()),'_blank');break;
    case 'copysum':{const ta=$('#sum');try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent='Kopyalandı ✓'})}catch(e){ta.select();document.execCommand('copy');t.textContent='Kopyalandı ✓'}break}
    case 'opencoach':$('#coachf').click();break;
    case 'lastcoach':{try{enterCoach(JSON.parse(lastReport()))}catch(e){alert('Kayıtlı rapor açılamadı.')}break}
    case 'exitcoach':exitCoach();break;
    case 'export':exportData();break;
    case 'import':$('#impf').click();break;
    case 'closedlg':closeDlg();break;
    case 'closewelcome':case 'tourskip':closeDlg();tourEnd();break;
    case 'tourgo':tourGo(+t.dataset.i);break;
    case 'sendmail':sendMail();break;
    case 'accent':S.accent=t.dataset.c;save();applyAccent();if($('#dlg [data-act=accentok]'))accentDlg();else settings();break;
    case 'accentok':S.accentAsked=true;save();closeDlg();if(!RO&&S.intro!==INTRO_V)tourStart();break;
    case 'installpwa':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null})}break;
    case 'snooze':S.snooze=new Date(Date.now()+3*864e5).toISOString();save();renderBanner();break;
    case 'pastecoach':openDlg('<h2>Rapor yapıştır</h2><p class="sub">Mail ya da mesajla gelen rapor dosyasının içeriğini buraya yapıştır.</p><div class="fld full"><label for="pasta">Rapor metni</label><textarea id="pasta" style="height:140px" placeholder="{...}"></textarea></div><div class="acts"><button class="btn ghost" data-act="closedlg">Vazgeç</button><button class="btn" data-act="openpaste">Görüntüle</button></div>');break;
    case 'openpaste':{try{const o=JSON.parse($('#pasta').value);enterCoach(o.kind==='ozanfit-rapor'?o:{data:o})}catch(e){alert('Bu metin geçerli bir Enes FitApp raporu değil.')}break}
    case 'saveset':{
      const p=S.profile,g=id=>$('#s_'+id).value;
      const rg=(v,a,b,d)=>{v=num(v);return v!=null&&v>=a&&v<=b?v:d};p.ad=g('ad').trim().slice(0,30)||'Ozan';p.boy=rg(g('boy'),100,250,p.boy);p.kilo=rg(g('kilo'),30,300,p.kilo);p.yas=rg(g('yas'),10,100,p.yas);
      p.start=validDate(g('start'))?g('start'):p.start;p.akt=+g('akt');p.hedef=g('hedef');S.theme=g('tema');
      save();applyTheme();applyAccent();closeDlg();ui.date=todayISO();ui.day=undefined;render();break;
    }
    case 'reset':if(confirm('Tüm kayıtların silinecek. Bu geri alınamaz. Emin misin?')){S=defaults();S.seen=true;S.intro=INTRO_V;S.accentAsked=true;save();applyTheme();applyAccent();renderBanner();closeDlg();ui.chart=null;render()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='chartsel'){if(t.value){ui.chart=t.value;render(true)}return}
  if(t.id==='dsel'){ui.date=t.value||todayISO();ui.day=undefined;render();return}
  if(t.id==='coachf'){if(t.files[0])openReport(t.files[0]);t.value='';return}
  if(t.id==='impf'){if(t.files[0])importData(t.files[0]);t.value='';return}
  const art=t.closest&&t.closest('.ex');if(!art)return;
  if(t.matches('[data-role=ver]')){
    const ex=SLOT[art.dataset.slot],key=logKey(ui.date,ex.slot),old=S.logs[key]||{d:ui.date,slot:ex.slot,mid:ex.mid,sets:[]};
    old.v=t.value;
    // kg of sets that have no reps must not stick to the previous version's suggestion
    old.sets=(old.sets||[]).map(s=>s&&s.reps>0?s:{kg:null,reps:null});
    if(!old.v&&!old.sets.some(s=>s.reps>0))delete S.logs[key];else S.logs[key]=old;
    save();const y=window.scrollY;art.outerHTML=cardHTML(ex,ui.date);refreshCard($('[data-slot="'+ex.slot+'"]'));window.scrollTo(0,y);
    const na=$('[data-slot="'+ex.slot+'"]');if(na){const d=$('details.more',na);if(d)d.open=true}
    return;
  }
  if(t.classList.contains('rp')&&num(t.value)>0){
    const ex=SLOT[art.dataset.slot],rows=$$('.set',art),idx=rows.indexOf(t.closest('.set'));
    saveCard(art);
    if(idx<rows.length-1)startTimer(ex.rs,ex.ad);else stopTimer();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,art=t.closest&&t.closest('.ex');if(!art||!t.matches('input'))return;
  if(t.classList.contains('kg')){
    const row=t.closest('.set'),rows=$$('.set',art),i=rows.indexOf(row);
    for(let j=i+1;j<rows.length;j++){const rp=$('.rp',rows[j]);if(!rp.value)$('.kg',rows[j]).value=t.value}
  }
  saveCard(art);
});
$('#tmx').addEventListener('click',stopTimer);
$('#btnSet').addEventListener('click',settings);
let lastW=window.innerWidth;
window.addEventListener('resize',debounce(()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;if(ui.tab==='gelisim'||ui.tab==='vucut')render(true)},150));
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg.open)closeDlg()});
$('#btnHelp').addEventListener('click',()=>{if(!RO)tourGo(0)});

/* ============================== INIT ============================== */
applyTheme();applyAccent();renderBanner();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(!RO&&!S.accentAsked)accentDlg();else if(!RO&&S.intro!==INTRO_V)tourStart();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
